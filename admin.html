<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Tambah Lagu Suno</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    .form-container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
    h2 { margin-bottom: 20px; color: #38bdf8; text-align: center; }
    label { display: block; margin-top: 10px; font-size: 0.9rem; color: #94a3b8; }
    input { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; margin-top: 20px; background: #2563eb; color: #fff; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>➕ Tambah Lagu Baru</h2>
    <form id="songForm">
      <label>Judul Lagu:</label>
      <input type="text" id="title" placeholder="Contoh: Malam Bertabur Bintang" required>

      <label>Genre / Deskripsi:</label>
      <input type="text" id="genre" placeholder="Contoh: Suno AI • Pop Acoustic" required>

      <label>URL Gambar Cover (dari Supabase Storage):</label>
      <input type="url" id="cover_url" placeholder="https://.../cover1.jpg" required>

      <label>URL Audio MP3 (dari Supabase Storage):</label>
      <input type="url" id="audio_url" placeholder="https://.../lagu1.mp3" required>

      <button type="submit">Simpan Lagu ke Website</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    // ⚠️ GANTI DENGAN API CREDENTIALS SUPABASE KAMU
    const SUPABASE_URL = 'https://XYZXYZ.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('songForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = 'Menyimpan...';

      const title = document.getElementById('title').value;
      const genre = document.getElementById('genre').value;
      const cover_url = document.getElementById('cover_url').value;
      const audio_url = document.getElementById('audio_url').value;

      const { data, error } = await supabaseClient
        .from('songs')
        .insert([{ title, genre, cover_url, audio_url }]);

      if (error) {
        statusDiv.style.color = '#ef4444';
        statusDiv.innerText = 'Gagal menyimpan: ' + error.message;
      } else {
        statusDiv.style.color = '#4ade80';
        statusDiv.innerText = '✅ Lagu berhasil ditambahkan!';
        document.getElementById('songForm').reset();
      }
    });
  </script>
</body>
</html>
