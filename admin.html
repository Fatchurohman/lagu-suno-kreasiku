<!-- Container Tool Sinkronisasi Lirik (LRC Generator) -->
<div class="lrc-maker-card">
  <h3 class="lrc-title">LRC Lyric Syncer Tool</h3>
  <p class="lrc-desc">
    Paste teks lirik mentah (tanpa timestamp), load audio, lalu tekan tombol <b>SPASI</b> atau klik <b>Tag Time</b> saat lagu diputar.
  </p>

  <!-- Step 1: Input Audio & Teks Mentah -->
  <div class="lrc-input-grid">
    <div class="form-group">
      <label for="lrc-audio-url">URL File Audio / Karaoke</label>
      <div class="audio-loader-row">
        <input type="url" id="lrc-audio-url" placeholder="https://domain.com/audio.mp3">
        <button type="button" id="btn-load-audio" class="btn-lrc btn-secondary">Load</button>
      </div>
      <audio id="lrc-audio-player" controls class="lrc-audio-player"></audio>
    </div>

    <div class="form-group">
      <label for="raw-lyrics-input">Teks Lirik Mentah (1 Baris = 1 Ketukan)</label>
      <textarea id="raw-lyrics-input" rows="6" placeholder="Bait pertama&#10;Bait kedua&#10;Bait ketiga"></textarea>
      <button type="button" id="btn-prepare-sync" class="btn-lrc btn-primary" style="margin-top: 8px;">
        Siapkan untuk Sync
      </button>
    </div>
  </div>

  <!-- Step 2: Interactive Sync Area -->
  <div id="lrc-sync-workspace" class="sync-workspace hidden">
    <div class="sync-controls">
      <button type="button" id="btn-tag-timestamp" class="btn-lrc btn-tag">
        <span class="key-badge">Space</span> TAG TIME BARIS AKTIF
      </button>
      <button type="button" id="btn-reset-sync" class="btn-lrc btn-danger">Reset Sync</button>
    </div>

    <div class="sync-lines-wrapper" id="sync-lines-container">
      <!-- Generated lines via JavaScript -->
    </div>
  </div>

  <!-- Step 3: Hasil Format LRC (Kolom ini yang dikirim ke Supabase) -->
  <div class="form-group" style="margin-top: 16px;">
    <div class="result-header">
      <label for="final-lrc-output">Hasil Format LRC (Kolom <code>karaoke_lyrics</code>)</label>
      <button type="button" id="btn-copy-lrc" class="btn-lrc btn-copy">Salin Teks</button>
    </div>
    <textarea id="final-lrc-output" rows="6" readonly placeholder="[00:00.00] Hasil LRC akan muncul otomatis di sini..."></textarea>
  </div>
</div>

<style>

  background-color: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 24px;
  margin-top: 20px;
  color: #f8fafc;
  font-family: inherit;
}

.lrc-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: #38bdf8;
  margin-bottom: 4px;
}

.lrc-desc {
  font-size: 0.88rem;
  color: #94a3b8;
  margin-bottom: 20px;
  line-height: 1.4;
}

.lrc-input-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

@media (max-width: 768px) {
  .lrc-input-grid {
    grid-template-columns: 1fr;

}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group label {

  color: #cbd5e1;
}

  display: flex;

}

  background-color: #0f172a;
  border: 1px solid #334155;
  color: #f8fafc;
  padding: 10px 12px;
  border-radius: 8px;

.audio-loader-row input[type="url"]:focus,

<script>
/**
 * LRC Generator Engine
 */
class LrcGenerator {
  constructor() {
    this.audio = document.getElementById('lrc-audio-player');
    this.audioUrlInput = document.getElementById('lrc-audio-url');
    this.btnLoadAudio = document.getElementById('btn-load-audio');
    
    this.rawLyricsInput = document.getElementById('raw-lyrics-input');
    this.btnPrepare = document.getElementById('btn-prepare-sync');
    
    this.workspace = document.getElementById('lrc-sync-workspace');
    this.linesContainer = document.getElementById('sync-lines-container');
    this.btnTag = document.getElementById('btn-tag-timestamp');
    this.btnReset = document.getElementById('btn-reset-sync');
    
    this.outputArea = document.getElementById('final-lrc-output');
    this.btnCopy = document.getElementById('btn-copy-lrc');

    this.linesData = [];
    this.currentIndex = 0;

    this.bindEvents();
  }

  bindEvents() {
    // Load Audio Source
    this.btnLoadAudio.addEventListener('click', () => {
      const url = this.audioUrlInput.value.trim();
      if (url) {
        this.audio.src = url;
        this.audio.load();
      }
    });

    // Prepare Sync Lines
    this.btnPrepare.addEventListener('click', () => this.prepareSyncWorkspace());

    // Tag Time Button
    this.btnTag.addEventListener('click', () => this.tagCurrentLine());

    // Reset Sync
    this.btnReset.addEventListener('click', () => this.resetSync());

    // Copy Result
    this.btnCopy.addEventListener('click', () => this.copyResult());

    // Keyboard Space Listener for Quick Tagging
    window.addEventListener('keydown', (e) => {
      // Pastikan spasi hanya mentrigger sync jika fokus tidak berada di dalam input/textarea
      const isInputFocused = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);
      if (e.code === 'Space' && !isInputFocused && !this.workspace.classList.contains('hidden')) {
        e.preventDefault();
        this.tagCurrentLine();
      }
    });
  }

  prepareSyncWorkspace() {
    const text = this.rawLyricsInput.value.trim();
    if (!text) {
      alert('Silakan masukkan teks lirik mentah terlebih dahulu.');
      return;
    }

    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    if (lines.length === 0) return;

    this.linesData = lines.map(lineText => ({
      text: lineText,
      timestamp: null
    }));

    this.currentIndex = 0;
    this.renderSyncRows();
    this.workspace.classList.remove('hidden');
    this.updateOutputText();
  }

  renderSyncRows() {
    this.linesContainer.innerHTML = '';
    
    this.linesData.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'sync-row';
      row.id = `sync-row-${index}`;

      if (index === this.currentIndex) row.classList.add('current-active');
      if (item.timestamp !== null) row.classList.add('tagged');

      const timeSpan = document.createElement('span');
      timeSpan.className = 'sync-time-tag';
      timeSpan.textContent = item.timestamp !== null ? this.formatLrcTime(item.timestamp) : '[--:--.--]';

      const textSpan = document.createElement('span');
      textSpan.textContent = item.text;

      row.appendChild(timeSpan);
      row.appendChild(textSpan);
      this.linesContainer.appendChild(row);
    });

    this.scrollToActiveRow();
  }

  tagCurrentLine() {
    if (this.currentIndex >= this.linesData.length) return;

    const currentTime = this.audio.currentTime || 0;
    this.linesData[this.currentIndex].timestamp = currentTime;

    // Update row visual saat ini
    const currentRow = document.getElementById(`sync-row-${this.currentIndex}`);
    if (currentRow) {
      currentRow.classList.remove('current-active');
      currentRow.classList.add('tagged');
      const timeSpan = currentRow.querySelector('.sync-time-tag');
      if (timeSpan) timeSpan.textContent = this.formatLrcTime(currentTime);
    }

    this.currentIndex++;

    // Set baris berikutnya aktif
    if (this.currentIndex < this.linesData.length) {
      const nextRow = document.getElementById(`sync-row-${this.currentIndex}`);
      if (nextRow) nextRow.classList.add('current-active');
      this.scrollToActiveRow();
    }

    this.updateOutputText();
  }

  scrollToActiveRow() {
    const activeRow = document.getElementById(`sync-row-${this.currentIndex}`);
    if (activeRow) {
      activeRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  resetSync() {
    this.currentIndex = 0;
    this.linesData.forEach(item => item.timestamp = null);
    this.renderSyncRows();
    this.updateOutputText();
  }

  updateOutputText() {
    const lrcLines = this.linesData.map(item => {
      const tag = item.timestamp !== null ? this.formatLrcTime(item.timestamp) : '[00:00.00]';
      return `${tag} ${item.text}`;
    });

    this.outputArea.value = lrcLines.join('\n');
  }

  formatLrcTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = (seconds % 60).toFixed(2);
    const formattedMins = String(mins).padStart(2, '0');
    const formattedSecs = String(secs).padStart(5, '0');
    return `[${formattedMins}:${formattedSecs}]`;
  }

  copyResult() {
    if (!this.outputArea.value.trim()) return;
    navigator.clipboard.writeText(this.outputArea.value)
      .then(() => alert('Format LRC berhasil disalin ke clipboard!'))
      .catch(err => console.error('Gagal menyalin:', err));
  }
}

// Inisialisasi Tool
document.addEventListener('DOMContentLoaded', () => {
  new LrcGenerator();
});
</script>
