<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Tambah Lagu Suno</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; max-width: 500px; margin: auto; }
    .card { background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    h2 { text-align: center; color: #38bdf8; margin-top: 0; }
    label { display: block; margin-top: 14px; font-size: 14px; color: #94a3b8; font-weight: bold; }
    input[type="text"], textarea { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
    input[type="file"] { width: 100%; margin-top: 5px; padding: 8px; background: #0f172a; border-radius: 6px; border: 1px dashed #38bdf8; color: #cbd5e1; box-sizing: border-box; cursor: pointer; }
    textarea { height: 100px; resize: vertical; font-family: inherit; }
    button { width: 100%; padding: 12px; margin-top: 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; word-break: break-word; }
  </style>
</head>
<body>

  <div class="card">
    <h2>➕ Tambah Lagu Baru</h2>
    
    <label>Judul Lagu:</label>
    <input type="text" id="title" placeholder="Contoh: Cinta Musim Durian">
    
    <label>Genre / Deskripsi:</label>
    <input type="text" id="genre" placeholder="Contoh: Pop / Dangdut">
    
    <label>Lirik Lagu (Opsional):</label>
    <textarea id="lyrics" placeholder="Masukkan lirik lagu di sini..."></textarea>
    
    <label>🖼️ Upload Gambar Cover (JPG/PNG):</label>
    <input type="file" id="cover_file" accept="image/*">
    
    <label>🎵 Upload File Audio (MP3):</label>
    <input type="file" id="audio_file" accept="audio/*">
    
    <button id="btnSubmit" onclick="simpanLagu()">Simpan & Unggah Lagu</button>
    
    <div id="status"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nqbjtzhhizjkhmhkkatb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_sIbk3yeQLELLhqDrvc9QHQ_1qErOVjU';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function simpanLagu() {
      const title = document.getElementById('title').value.trim();
      const genre = document.getElementById('genre').value.trim();
      const lyrics = document.getElementById('lyrics').value.trim();
      const coverFileInput = document.getElementById('cover_file');
      const audioFileInput = document.getElementById('audio_file');
      const statusDiv = document.getElementById('status');
      const btnSubmit = document.getElementById('btnSubmit');

      const coverFile = coverFileInput.files[0];
      const audioFile = audioFileInput.files[0];

      if (!title || !genre || !coverFile || !audioFile) {
        statusDiv.style.color = '#ef4444';
        statusDiv.innerText = '❌ Judul, Genre, Gambar Cover, dan File MP3 wajib diisi!';
        return;
      }

      try {
        btnSubmit.disabled = true;
        btnSubmit.innerText = '⏳ Mengunggah file...';
        statusDiv.style.color = '#f59e0b';
        statusDiv.innerText = '⏳ Sedang mengunggah Gambar Cover & MP3 ke Supabase...';

        const timestamp = Date.now();
        const sanitizeFileName = (name) => name.replace(/[^a-zA-Z0-9.-]/g, '_');

        // 1. Upload Cover ke Storage
        const coverPath = `covers/${timestamp}_${sanitizeFileName(coverFile.name)}`;
        const { data: coverUpload, error: coverError } = await _supabase
          .storage
          .from('lagu-suno')
          .upload(coverPath, coverFile, { cacheControl: '3600', upsert: true });

        if (coverError) throw new Error('Gagal upload cover: ' + coverError.message);

        // 2. Upload Audio ke Storage
        const audioPath = `audio/${timestamp}_${sanitizeFileName(audioFile.name)}`;
        const { data: audioUpload, error: audioError } = await _supabase
          .storage
          .from('lagu-suno')
          .upload(audioPath, audioFile, { cacheControl: '3600', upsert: true });

        if (audioError) throw new Error('Gagal upload audio: ' + audioError.message);

        // 3. Dapatkan Public URL
        const { data: coverUrlData } = _supabase.storage.from('lagu-suno').getPublicUrl(coverPath);
        const { data: audioUrlData } = _supabase.storage.from('lagu-suno').getPublicUrl(audioPath);

        const cover_url = coverUrlData.publicUrl;
        const audio_url = audioUrlData.publicUrl;

        // 4. Simpan Informasi ke Database
        statusDiv.innerText = '⏳ Menyimpan data ke database...';
        const { error: dbError } = await _supabase
          .from('songs')
          .insert([{ title, genre, lyrics, cover_url, audio_url }]);

        if (dbError) throw dbError;

        statusDiv.style.color = '#22c55e';
        statusDiv.innerText = '✅ Berhasil! Lagu & file otomatis ter-upload ke website.';

        // Reset form
        document.getElementById('title').value = '';
        document.getElementById('genre').value = '';
        document.getElementById('lyrics').value = '';
        coverFileInput.value = '';
        audioFileInput.value = '';

      } catch (err) {
        statusDiv.style.color = '#ef4444';
        statusDiv.innerText = '❌ ' + err.message;
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Simpan & Unggah Lagu';
      }
    }
  </script>
</body>
</html>
