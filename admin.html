<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Tambah Lagu Suno</title>
  <!-- Library Supabase Resmi JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; max-width: 500px; margin: auto; }
    .card { background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    h2 { text-align: center; color: #38bdf8; margin-top: 0; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #94a3b8; }
    input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 12px; margin-top: 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>➕ Tambah Lagu Baru</h2>
    
    <label>Judul Lagu:</label>
    <input type="text" id="title" placeholder="Contoh: Cinta Musim Durian">
    
    <label>Genre / Deskripsi:</label>
    <input type="text" id="genre" placeholder="Contoh: Pop">
    
    <label>URL Gambar Cover (dari Supabase Storage):</label>
    <input type="text" id="cover_url" placeholder="https://.../cover.jpg">
    
    <label>URL Audio MP3 (dari Supabase Storage):</label>
    <input type="text" id="audio_url" placeholder="https://.../lagu.mp3">
    
    <button onclick="simpanLagu()">Simpan Lagu ke Website</button>
    
    <div id="status"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nqbjtzhhizjkhmhkkatb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_sIbk3yeQLELLhqDrvc9QHQ_1qErOVjU';

    // Inisialisasi Klien Supabase Resmi
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function simpanLagu() {
      const title = document.getElementById('title').value.trim();
      const genre = document.getElementById('genre').value.trim();
      const cover_url = document.getElementById('cover_url').value.trim();
      const audio_url = document.getElementById('audio_url').value.trim();
      const statusDiv = document.getElementById('status');

      if (!title || !genre || !cover_url || !audio_url) {
        statusDiv.style.color = '#ef4444';
        statusDiv.innerText = '❌ Semua kolom harus diisi!';
        return;
      }

      statusDiv.style.color = '#f59e0b';
      statusDiv.innerText = '⏳ Menyimpan data...';

      const { data, error } = await _supabase
        .from('songs')
        .insert([{ title, genre, cover_url, audio_url }]);

      if (error) {
        statusDiv.style.color = '#ef4444';
        statusDiv.innerText = 'Gagal menyimpan: ' + error.message;
      } else {
        statusDiv.style.color = '#22c55e';
        statusDiv.innerText = '✅ Lagu berhasil ditambahkan!';
        document.getElementById('title').value = '';
        document.getElementById('genre').value = '';
        document.getElementById('cover_url').value = '';
        document.getElementById('audio_url').value = '';
      }
    }
  </script>
</body>
</html>
