<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koleksi Musik Suno AI</title>
  <style>
    /* Reset & Dasar Halaman */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a; /* Warna background gelap modern */
      color: #f8fafc;
      padding: 40px 20px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    header h1 {
      font-size: 2.2rem;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    header p {
      color: #94a3b8;
      font-size: 1rem;
    }

    /* Grid Kartu Responsive */
    .music-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Komponen Kartu Musik */
    .card {
      background-color: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.15);
    }

    /* Cover Gambar */
    .cover-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    /* Isi Kartu */
    .card-body {
      padding: 18px;
    }
    .title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .artist {
      font-size: 0.85rem;
      color: #38bdf8;
      margin-bottom: 15px;
    }

    /* Audio Player Custom Style */
    audio {
      width: 100%;
      height: 40px;
      margin-bottom: 15px;
      outline: none;
    }

    /* Tombol Download */
    .btn-download {
      display: block;
      width: 100%;
      text-align: center;
      padding: 10px 0;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      transition: background 0.2s ease;
    }
    .btn-download:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
    }
  </style>
</head>
<body>

  <header>
    <h1>🎵 Portfolio Musik Suno AI</h1>
    <p>Dengarkan streaming langsung atau unduh lagu favoritmu secara gratis!</p>
  </header>

  <div class="music-grid">

    <!-- ==================== KARTU LAGU 1 ==================== -->
    <div class="card">
      <img src="covers/cover1.jpg" alt="Cover Lagu 1" class="cover-img">
      <div class="card-body">
        <h2 class="title">Malam Bertabur Bintang</h2>
        <p class="artist">Suno AI • Pop Acoustic</p>
        
        <!-- Pemutar Audio -->
        <audio controls controlsList="nodownload">
          <source src="audio/lagu1.mp3" type="audio/mpeg">
          Browser Anda tidak mendukung pemutar audio.
        </audio>

        <!-- Tombol Download -->
        <a href="audio/lagu1.mp3" download="Malam Bertabur Bintang.mp3" class="btn-download">
          📥 Download MP3
        </a>
      </div>
    </div>

    <!-- ==================== KARTU LAGU 2 ==================== -->
    <div class="card">
      <img src="covers/cover2.jpg" alt="Cover Lagu 2" class="cover-img">
      <div class="card-body">
        <h2 class="title">Jejak di Udara</h2>
        <p class="artist">Suno AI • Synthwave Rock</p>
        
        <!-- Pemutar Audio -->
        <audio controls controlsList="nodownload">
          <source src="audio/lagu2.mp3" type="audio/mpeg">
          Browser Anda tidak mendukung pemutar audio.
        </audio>

        <!-- Tombol Download -->
        <a href="audio/lagu2.mp3" download="Jejak di Udara.mp3" class="btn-download">
          📥 Download MP3
        </a>
      </div>
    </div>

    <!-- Nanti kalau mau tambah lagu baru, tinggal COPY-PASTE blok "KARTU LAGU" di atas ini -->

  </div>

</body>
</html>
