<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Dalam Perbaikan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .maintenance-container {
            max-width: 500px;
            background: #1e1e1e;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #ff9800;
        }
        p {
            font-size: 16px;
            color: #b0b0b0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <h1>Mohon Maaf 🛠️</h1>
        <p>Aplikasi ini masih dalam perbaikan gays.</p>
    </div>

</body>
</html>
