<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koleksi Musik Suno AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #f8fafc; padding: 40px 20px; }
    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 2.2rem; color: #38bdf8; margin-bottom: 8px; }
    .music-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
    .card { background-color: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
    .cover-img { width: 100%; height: 220px; object-fit: cover; }
    .card-body { padding: 18px; }
    .title { font-size: 1.15rem; font-weight: 600; color: #f8fafc; margin-bottom: 4px; }
    .artist { font-size: 0.85rem; color: #38bdf8; margin-bottom: 15px; }
    audio { width: 100%; height: 40px; margin-bottom: 15px; }
    .btn-download { display: block; width: 100%; text-align: center; padding: 10px 0; background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; text-decoration: none; font-weight: 600; border-radius: 8px; }
  </style>
</head>
<body>

  <header>
    <h1>🎵 Portfolio Musik Suno AI</h1>
    <p>Dengarkan streaming langsung atau unduh lagu favoritmu!</p>
  </header>

  <div class="music-grid" id="musicGrid">
    <!-- Kartu-kartu lagu akan muncul otomatis di sini via JavaScript -->
  </div>

  <script>
    // ⚠️ GANTI DENGAN API CREDENTIALS SUPABASE KAMU
    const SUPABASE_URL = 'https://XYZXYZ.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadSongs() {
      const grid = document.getElementById('musicGrid');
      grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Memuat lagu...</p>';

      const { data: songs, error } = await supabaseClient
        .from('songs')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Gagal memuat lagu.</p>';
        return;
      }

      grid.innerHTML = '';
      songs.forEach(song => {
        const cardHtml = `
          <div class="card">
            <img src="${song.cover_url}" alt="Cover" class="cover-img">
            <div class="card-body">
              <h2 class="title">${song.title}</h2>
              <p class="artist">${song.genre}</p>
              <audio controls controlsList="nodownload">
                <source src="${song.audio_url}" type="audio/mpeg">
              </audio>
              <a href="${song.audio_url}" download="${song.title}.mp3" class="btn-download">
                📥 Download MP3
              </a>
            </div>
          </div>
        `;
        grid.innerHTML += cardHtml;
      });
    }

    loadSongs();
  </script>
</body>
</html>
